# Builds and publishes austinzwick.com.
# Runs on every commit, once a day, and on demand (Actions tab > Run workflow).
# Each run pulls the latest Substack posts into the page before publishing.

name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * *"   # daily, 14:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The only line to change if the Substack address changes.
  SUBSTACK_URL: https://austinzwick.substack.com
  POST_COUNT: "3"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Copy site files
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/

      - name: Add latest Substack posts
        run: |
          python3 - <<'PY'
          import html, json, os, re, urllib.parse, urllib.request
          import xml.etree.ElementTree as ET

          base = os.environ["SUBSTACK_URL"].rstrip("/")
          count = int(os.environ.get("POST_COUNT", "3"))
          path = "_site/index.html"
          page = open(path, encoding="utf-8").read()
          page = page.replace("SUBSTACK_URL", base)

          CONTENT = "{http://purl.org/rss/1.0/modules/content/}encoded"
          MEDIA = "{http://search.yahoo.com/mrss/}content"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                            "(KHTML, like Gecko) Chrome/124.0 Safari/537.36",
              "Accept": "application/rss+xml, application/xml, application/json, */*",
          }

          def get(url):
              req = urllib.request.Request(url, headers=HEADERS)
              return urllib.request.urlopen(req, timeout=30).read()

          def plain(text, limit=180):
              text = html.unescape(re.sub(r"<[^>]+>", " ", text or ""))
              text = re.sub(r"\s+", " ", text).strip()
              return text if len(text) <= limit else text[:limit].rsplit(" ", 1)[0] + "…"

          def first_img(markup):
              m = re.search(r'<img[^>]+src="([^"]+)"', markup or "")
              return m.group(1) if m else ""

          def from_substack():
              root = ET.fromstring(get(base + "/feed"))
              posts = []
              for item in root.iter("item"):
                  img = ""
                  enc = item.find("enclosure")
                  media = item.find(MEDIA)
                  if enc is not None and enc.get("type", "").startswith("image"):
                      img = enc.get("url")
                  elif media is not None and media.get("url"):
                      img = media.get("url")
                  else:
                      img = first_img(item.findtext(CONTENT))
                  posts.append({"title": item.findtext("title"), "link": item.findtext("link"),
                                "sub": item.findtext("description"), "img": img})
              return posts

          def from_rss2json():
              api = "https://api.rss2json.com/v1/api.json?rss_url=" + urllib.parse.quote(base + "/feed", safe="")
              data = json.loads(get(api))
              if data.get("status") != "ok":
                  raise RuntimeError(data.get("message", "rss2json returned an error"))
              posts = []
              for item in data.get("items", []):
                  enc = item.get("enclosure") or {}
                  img = item.get("thumbnail") or (enc.get("link") if str(enc.get("type", "")).startswith("image") else "") \
                        or first_img(item.get("content"))
                  posts.append({"title": item.get("title"), "link": item.get("link"),
                                "sub": item.get("description"), "img": img})
              return posts

          posts = []
          for name, source in (("Substack", from_substack), ("rss2json", from_rss2json)):
              try:
                  posts = source()
                  print(f"Loaded feed from {name}: {len(posts)} posts")
                  break
              except Exception as e:
                  print(f"Could not load feed from {name}: {e}")

          rows = []
          e = html.escape
          for post in posts:
              title = plain(post["title"], 200)
              link = (post["link"] or "").strip()
              if not title or not link:
                  continue
              sub = plain(post["sub"])
              img = post["img"]
              rows.append(
                  f'      <li><a class="post" href="{e(link)}">'
                  + (f'<img class="post-img" src="{e(img)}" alt="" loading="lazy">' if img
                     else '<span class="post-img post-img-empty" aria-hidden="true"></span>')
                  + f'<span class="post-text"><span class="post-title">{e(title)}</span>'
                  + (f'<span class="post-sub">{e(sub)}</span>' if sub else "")
                  + "</span></a></li>"
              )
              if len(rows) == count:
                  break

          if rows:
              block = '<ul class="posts">\n' + "\n".join(rows) + "\n    </ul>"
              page = re.sub(r"<!-- SUBSTACK:START -->.*?<!-- SUBSTACK:END -->",
                            lambda m: f"<!-- SUBSTACK:START -->\n    {block}\n    <!-- SUBSTACK:END -->",
                            page, flags=re.S)
              print(f"Added {len(rows)} posts")
          else:
              print("No posts added; the page keeps its fallback link")

          open(path, "w", encoding="utf-8").write(page)
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
